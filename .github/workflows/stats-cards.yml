name: Stats cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the card renderer
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          # Pinned: bump deliberately after reviewing upstream changes.
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          path: .renderer

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer dependencies
        working-directory: .renderer
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate the SVG cards
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-cards.mjs .renderer "$OWNER" generated

      - name: Commit changed cards
        run: |
          if [ -z "$(git status --porcelain -- generated)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Update stats cards"
          git push
